[project]
name = "dxo-sraw"
version = "0.1.0"
description = "Split DxO ONE SuperRAW files into individual DNG frames"
readme = "README.md"
authors = [
    { name = "Eli Gao", email = "refraction222@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dxo-sraw = "dxo_sraw.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
